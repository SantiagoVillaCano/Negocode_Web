<!-- Hero -->
<section id="hero" class="hero" aria-label="Sección principal">
  <div class="hero-bg">
    <div class="hero-grid-pattern"></div>
    <div class="hero-glow hero-glow-1"></div>
    <div class="hero-glow hero-glow-2"></div>
    <div class="hero-float hero-float-1"></div>
    <div class="hero-float hero-float-2"></div>
    <div class="hero-float hero-float-3"></div>
  </div>

  <div class="container hero-content">
    
    <h1 class="heading-xl text-balance"><span class="text-gradient">&lt;</span>NegoCode<span class="text-gradient ">&gt;</span></h1>
    <div class="hero-badge">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      <span>Soluciones digitales de alto nivel</span>
    </div>

    <h1 class="heading-xl text-balance">
      Transformamos ideas en<br>
      <span class="text-gradient">soluciones digitales</span>
    </h1>

    <p class="hero-description">
      En Negocode desarrollamos software y productos digitales que ayudan a las empresas a crecer, optimizar sus procesos y avanzar hacia el futuro.
    </p>

    <div class="hero-actions">
      <a
        class="btn btn-primary btn-lg"
        tabindex="0"
        (click)="navigateTo('services')"
        (keydown.enter)="navigateTo('services')"
      >
        Conoce nuestras soluciones
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </a>
      <a
        class="btn btn-secondary btn-lg"
        tabindex="0"
        (click)="navigateTo('contact')"
        (keydown.enter)="navigateTo('contact')"
      >
        Hablemos de tu proyecto
      </a>
    </div>
  </div>
</section>
